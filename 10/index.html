    <style>
      /* What the workshop is up to while the next piece is made. */
      #making {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease;
        font-family: "Segoe UI", sans-serif;
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      #making.on {
        opacity: 1;
      }
      #making span {
        padding: 8px 16px;
        border-radius: 999px;
        background: rgb(32, 32, 32);
        color: rgb(240, 240, 240);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 2px 10px rgba(0, 0, 0, 0.18);
        white-space: nowrap;
        display: inline-block;
        overflow: hidden;
        text-align: center;
        box-sizing: border-box;
        transition: width 0.35s ease;
      }
      #making span b {
        font-weight: inherit;
        display: inline-block;
        transition: opacity 0.18s ease;
      }
      #making i {
        display: block;
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.15);
        overflow: hidden;
        position: relative;
      }
      #making i::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.75);
        transform-origin: left;
        transform: scaleX(var(--progress, 0));
        transition: transform 0.25s ease;
      }
    </style>
  </head>
  <body>
    <!-- The day's backdrop colour, and its prompt as a verb: Folding…, Shattering… -->
    <div id="making"><span></span><i></i></div>
    <div id="loading" style="--loading-background: #1d1a18"><span>Etching…</span></div>
    <div id="main-gui">
      <div id="randomize-button" class="button" title="Randomize">
        <img src="../assets/randomize.svg" alt="Randomize" />
      </div>
      <div id="pause-button" class="button action" title="Pause">
        <img src="../assets/pause.svg" alt="Pause" />
      </div>
      <div id="gui-container"></div>
    </div>
  </body>
