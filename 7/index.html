    <style>
      /* What the sculpture is doing (building, hollowing, updating), as a pill like the loading one. */
      #status {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 4;
        transform: translate(-50%, 6px);
        padding: 7px 14px;
        border-radius: 999px;
        background: rgb(32, 32, 32);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 2px 10px rgba(0, 0, 0, 0.18);
        color: rgb(240, 240, 240);
        font-family: "Segoe UI", sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
        white-space: nowrap;
        overflow: hidden;
        isolation: isolate;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #status.shown {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #status::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: rgba(255, 255, 255, 0.16);
        transform-origin: left;
        transform: scaleX(var(--progress, 0));
        transition: transform 0.2s linear;
      }
      @media (max-width: 950px) {
        #status {
          bottom: 96px;
        }
      }
    </style>

  <body>
    <div id="loading" style="--loading-background: #d6d3cd"><span>Hollowing…</span></div>
