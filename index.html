<!doctype html>
<html lang="en">
  <head>
    <title>Codevember 2026</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta name="author" content="Jaume Sanchez Elias" />
    <link rel="canonical" href="https://spite.github.io/codevember-2026/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codevember 2026" />
    <meta property="og:title" content="Codevember 2026" />
    <meta property="og:description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta property="og:url" content="https://spite.github.io/codevember-2026/" />
    <meta property="og:image" content="https://spite.github.io/codevember-2026/screenshots/1-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Paper polyhedra from day 1, Fold, floating above a grey studio backdrop." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thespite" />
    <meta name="twitter:creator" content="@thespite" />
    <meta name="twitter:title" content="Codevember 2026" />
    <meta name="twitter:description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta name="twitter:image" content="https://spite.github.io/codevember-2026/screenshots/1-social.jpg" />
    <meta name="twitter:image:alt" content="Paper polyhedra from day 1, Fold, floating above a grey studio backdrop." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        padding: 1em;
        color: #333;
      }
      h1 {
        font-size: 1.4em;
      }
      a {
        color: inherit;
        text-decoration: none;

        &:hover {
          text-decoration: underline;
        }
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin: 2em 0;
        list-style-type: none;
      }
      .gallery li {
        position: relative;
        aspect-ratio: 1;
        background: #eee center / cover no-repeat;
        border-radius: 6px;
        overflow: hidden;
      }
      .gallery a {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        padding: 0.6em;
        color: #fff;
        background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.6));
      }
      .gallery .number {
        font-size: 2em;
        font-weight: bold;
        line-height: 1;
      }
      .gallery .soon {
        opacity: 0.4;
        pointer-events: none;
      }
      .gallery .soon a {
        color: #333;
        background: none;
      }
    </style>
  </head>

  <body>
    <h1>Codevember 2026</h1>
    <ul class="gallery"></ul>
    <p>
      Jaume Sanchez Elias
      <a href="https://twitter.com/thespite">twitter</a>
      <a href="https://github.com/spite">github</a>
    </p>
    <script type="module">
      import { days } from "./modules/days.js";

      const gallery = document.querySelector(".gallery");
      for (const { day, title } of days) {
        const li = document.createElement("li");
        if (title) {
          li.style.backgroundImage = `url(screenshots/${day}.jpg)`;
        } else {
          li.className = "soon";
        }
        const a = document.createElement("a");
        a.href = `./${day}/`;
        const number = document.createElement("span");
        number.className = "number";
        number.textContent = day;
        const label = document.createElement("span");
        label.textContent = title;
        a.append(number, label);
        li.append(a);
        gallery.append(li);
      }
    </script>
  </body>
</html>
