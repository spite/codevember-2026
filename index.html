<!doctype html>
<html lang="en">
  <head>
    <title>Codevember 2026</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta name="author" content="Jaume Sanchez Elias" />
    <link rel="canonical" href="https://spite.github.io/codevember-2026/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codevember 2026" />
    <meta property="og:title" content="Codevember 2026" />
    <meta property="og:description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta property="og:url" content="https://spite.github.io/codevember-2026/" />
    <meta property="og:image" content="https://spite.github.io/codevember-2026/screenshots/4-social.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A coil of twisted iridescent bands in blue, purple and pink chrome, from day 4, Tangle." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thespite" />
    <meta name="twitter:creator" content="@thespite" />
    <meta name="twitter:title" content="Codevember 2026" />
    <meta name="twitter:description" content="A three.js sketch every day of November 2026 by Jaume Sanchez Elias." />
    <meta name="twitter:image" content="https://spite.github.io/codevember-2026/screenshots/4-social.jpg" />
    <meta name="twitter:image:alt" content="A coil of twisted iridescent bands in blue, purple and pink chrome, from day 4, Tangle." />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        padding: 1em;
        color: #333;
      }
      h1 {
        font-size: 1.4em;
      }
      a {
        color: inherit;
        text-decoration: none;

        &:hover {
          text-decoration: underline;
        }
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin: 2em 0;
        list-style-type: none;
      }
      .gallery li {
        position: relative;
        aspect-ratio: 1;
        background: #eee center / cover no-repeat;
        border-radius: 6px;
        overflow: hidden;
      }
      .gallery a {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        padding: 0.6em;
        color: #fff;
        background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.6));
      }
      .gallery .number {
        font-size: 2em;
        font-weight: bold;
        line-height: 1;
      }
      .gallery .soon {
        opacity: 0.4;
        pointer-events: none;
      }
      .gallery .soon a {
        color: #333;
        background: none;
      }
      h2 {
        font-size: 1.1em;
        margin-bottom: 0.6em;
      }
      .explainers {
        margin-bottom: 2em;
        list-style-type: none;

        li {
          padding: 0.2em 0;
        }
        .number {
          display: inline-block;
          min-width: 2em;
          color: #999;
        }
      }
    </style>
  </head>

  <body>
    <h1>Codevember 2026</h1>
    <ul class="gallery"></ul>
    <h2>How they work</h2>
    <ul class="explainers"></ul>
    <p>
      Jaume Sanchez Elias
      <a href="https://twitter.com/thespite">twitter</a>
      <a href="https://github.com/spite">github</a>
    </p>
    <p><a href="https://github.com/spite/codevember-2026">Source code on GitHub</a></p>
    <script type="module">
      import { days } from "./modules/days.js";

      const gallery = document.querySelector(".gallery");
      for (const { day, prompt, title } of days) {
        const li = document.createElement("li");
        if (title) {
          li.style.backgroundImage = `url(screenshots/${day}.jpg)`;
        } else {
          li.className = "soon";
        }
        const a = document.createElement("a");
        a.href = `./${day}/`;
        const number = document.createElement("span");
        number.className = "number";
        number.textContent = day;
        const label = document.createElement("span");
        label.textContent = prompt;
        a.append(number, label);
        li.append(a);
        gallery.append(li);
      }

      // Explainers of published days, then the shared ones.
      const explainers = [
        [1, "How Fold Folds"],
        [2, "How Shatter Bursts"],
        [3, "How Melt Drips"],
        [4, "How Tangle Ties"],
        [6, "How the Orrery Turns"],
        [7, "How Hollow Hollows"],
      ]
        .filter(([day]) => days[day - 1].title)
        .map(([day, title]) => ({ number: day, title, href: `./${day}/explainer.html` }));
      explainers.push({ number: "", title: "The Photographic Pipeline", href: "./modules/pipeline/explainer.html" });
      const list = document.querySelector(".explainers");
      for (const { number, title, href } of explainers) {
        const li = document.createElement("li");
        const n = document.createElement("span");
        n.className = "number";
        n.textContent = number;
        const a = document.createElement("a");
        a.href = href;
        a.textContent = title;
        li.append(n, a);
        list.append(li);
      }
    </script>
  </body>
</html>
